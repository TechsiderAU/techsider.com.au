platformFirst: "If your staff have Microsoft Copilot, try agents in SharePoint first: they answer from a site's pages within each person's permissions. If Copilot Studio's built-in evaluation answers your question, we'll say so."
dontDo:
  - We don't build a general staff chat assistant to replace the one you already run.
  - We don't do adversarial testing in-house. A CREST-accredited tester you engage does it.
  - We don't sell AI policy paperwork, such as AI use-case registers or transparency statements.
  - We don't independently evaluate a system we built, configured or advised on for the same agency.
