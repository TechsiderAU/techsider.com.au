mockPanel:
  title: "Findings: staff policy agent (fictional)"
  fields:
    - label: Use case
      value: Staff questions on leave and travel
    - label: Ground truth
      value: Answers labelled by two policy officers
    - label: Accountable official
      value: Named officer
      redacted: true
  chips:
    - status: blocked
      text: A confident answer the policy doesn't support
    - status: review
      text: Declined, though the policy covers it
    - status: ok
      text: Cited clause says what the answer claims
  citations:
    - source: Fictional travel policy
      clause: Section 4
scenario:
  title: A policy agent leaving pilot at a fictional state department
  problem: A fictional department has piloted a Copilot Studio agent that answers staff policy questions. Before rollout, the accountable official wants to know how often it answers wrongly, and whether it declines when the policy is silent.
  approach: Two policy officers label expected answers independently, and the test runs in the department's own subscription.
  measure:
    - False answers the policy doesn't support
    - False refusals when the answer is in the policy
    - Whether each cited clause says what the answer claims
  shipsFirst: A test plan and a first failure list from public policy questions, before any staff data is touched.
  trace: government-scenario
firstEngagement:
  needFromYou:
    - "A named owner, and the instrument you report to: the DTA tool, the NSW AIAF or a FAIRA"
    - 30–50 questions your staff can answer, or approval to start on public or synthetic data
    - Read-only access to the system, and your risk matrix
  youGet:
    - A test plan with thresholds agreed before testing
    - An Independent Evaluation Report with the explicit failure list
    - The evidence bundle, replay script and harness, handed over to your team
  exitRamp: Once the test set and thresholds are agreed, and before testing starts, you decide whether to continue. If you stop, the test set and any results so far are yours.
faq:
  # ⚑ owner: "we publish the method" holds only if the evaluation method ships at launch (research index B10)
  - q: You have no clients yet. Why trust your evaluation?
    a: "Don't take it on trust. We have no clients yet, in government or anywhere else, so we publish the method instead: sample size, ground truth and thresholds. You get the test set and a replay script, so your team can check our work."
  - q: Will your report tell us the system is safe to deploy?
    a: No. You get findings, not an assurance opinion, and it isn't an ASAE 3000 engagement. Each finding is rated to your risk matrix, and your accountable official decides whether to deploy.
  - q: Do you evaluate systems you built, or take money from vendors?
    a: "Not independently, and no. We never independently evaluate a system we built, configured or advised on for the same client: our tests of our own builds are labelled \"acceptance test (not independent)\". We take no resale margin or referral fees from vendors we evaluate."
  - q: Will you red-team or penetration-test our AI agents?
    a: No. The Agentic AI Control Evaluation is a configuration review. Where prompt-injection or tool-misuse testing is needed, a CREST-accredited tester you engage does it, under written rules of engagement.
  - q: Does our test data leave our environment?
    a: Not to us. The test and its graders run in your own subscription. The system under test handles each question where its vendor runs it, as in normal use, and the report records the vendor's published processing location, with its date. While your privacy and security assessments run, we start on public or synthetic data in a Feasibility Sprint.
  - q: We're a council. What do you design around?
    a: "Your state's privacy and records rules, listed with their sources in the Local government section: the PPIP Act and State Records Act in NSW, PROV's recordkeeping policy for Victorian records, and the Information Privacy Act and Public Records Act in Queensland."
