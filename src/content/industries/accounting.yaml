  citations:
    - source: Trust deed
      clause: Clause 12
scenario:
  title: Year-end trust review at a fictional mid-size practice
  problem: At a fictional practice of about 120 staff, seniors reopen several hundred client trust deeds each June.
  approach: Two seniors record answers for 40 deeds they know. The register reads those deeds, links every value to its page and queues anything unsigned.
  measure:
    - Error rate for each field, with every miss listed
    - How often it says "not found" when the deed has the field
  shipsFirst: "The Two-Week Trial report: the error rate for each field, and a go/no-go."
  trace: accounting-scenario
firstEngagement:
  needFromYou:
    - 30–50 trust deeds your seniors know, with their answers
    - Read-only access to the deeds, or a secure copy
    - "A trial window: November to early December, or April to May"
  youGet:
    - A trial report with each field's error rate and every miss
    - Register rows for the trial deeds, linked to their pages
    - A one-page note on where deeds are processed
  exitRamp: At the go/no-go, you decide whether to continue. If you stop, you keep the trial report, the answer key and the rows produced.
faq:
  - q: Have you built this for other accounting practices?
    a: No. Techsider has no clients yet, in accounting or anywhere else, so you start with a Two-Week Trial on deeds your seniors know.
  - q: Do we need client permission before our deeds go through your system?
    a: Possibly, and more likely if we run it for you. The Code item 6 row in the regulatory map sets out what the TPB says. You get a data note naming every processor, and your adviser decides whether your terms cover it.
  - q: Where is the data processed?
    a: The register runs in an Australian region, in your own Microsoft or AWS account or one we manage. For Switch-On, you see each vendor's processing location where it's published.
  - q: Why not just use Karbon's AI, or FYI's ATO SmartDocs integration?
    a: Use them first. Neither reads your trust deeds into a register you can check field by field.
  - q: What happens when the AI model changes?
    a: The test on your answer key is re-run before the new model is used, and you see old and new results side by side.
