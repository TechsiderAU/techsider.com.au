  title: "Regression: complaint flags after an upgrade (fictional)"
  fields:
    - label: System
      value: Contact-centre call summaries
    - label: Compared
      value: Current model against the vendor's upgrade
  chips:
    - status: blocked
      text: Complaint missed by the upgrade
    - status: review
      text: Hardship-related complaint flagged by one model only
    - status: ok
      text: Summary cites the call segment
  citations:
    - source: Fictional call
      clause: Segment 3
scenario:
  title: Complaint flags after a summary-model change
  problem: A fictional customer-owned bank's contact-centre AI flags possible complaints. Its vendor announces a model upgrade without saying what changed.
  approach: The complaints team labels past, de-identified calls in the bank's own environment. The same calls run through both models.
  measure:
    - Complaint recall, current model against the upgrade
    - Recall on hardship and vulnerability cues, reported separately
  shipsFirst: A labelled test set and a baseline run to compare the upgrade against.
  trace: financial-services-scenario
firstEngagement:
  needFromYou:
    - One AI system and one use case, with a named control owner
    - Read-only access to past calls, chats or emails
    - One or two people to label examples
  youGet:
    - An Independent Evaluation Report listing every failure
    - An evidence bundle and replay script for your own subscription
    - A handover so your second line can re-run the test
  exitRamp: Once thresholds are agreed, you decide whether to continue. The test set is yours either way.
faq:
  # ⚑ owner: "the method is published" holds only if the evaluation method ships at launch (research index B10)
  - q: You have no clients yet. Why rely on your findings?
    a: Don't rely on our name; we have no clients yet. The method is published, and every finding comes with the test set, labels and a replay script, so your second line can re-perform it.
  - q: Can we give your report to the board or APRA as a formal opinion?
    a: No. It's findings, not an assurance opinion, and it isn't an ASAE 3000 or ASRE engagement. What you table, and how, is your decision.
  - q: Does customer data leave our environment?
    a: Not to us. The harness and graders run in your own Microsoft or AWS subscription. The vendor's system processes each test case where it runs in normal use, and the data note records where that is. If a grader would need a model outside Australia, we tell you before it runs.
  - q: Do we need to onboard you as a new supplier?
    a: Not necessarily. Through our Evaluation Partner route, the work can run under a firm you've already onboarded, such as your internal-audit co-source. How CPS 230 applies is your call.
  - q: Our vendor won't give model-change notice. Can testing make up for that?
    a: It can't replace contract terms, but it gives you your own evidence. Some platforms don't record which model version answered, so a scheduled re-run is one practical way to notice a change.
