mockPanel:
  title: "Side-by-side test: one question"
  fields:
    - label: Question
      value: Which clause sets the rent review date?
    - label: Tool A
      value: Clause 4.2, linked to the page
    - label: Tool B
      value: Clause 7.1, the make-good clause
  chips:
    - status: ok
      text: "Tool A: correct, citation found"
    - status: blocked
      text: "Tool B: wrong clause cited"
  citations:
    - source: Lease, de-identified
      clause: Clause 4.2
scenario:
  title: Two research tools, one renewal date.
  problem: A fictional commercial law firm must choose between two legal AI tools before its research subscription renews.
  approach: Senior lawyers pick questions from closed matters with known answers. Both tools answer them in the firm's own trial accounts, and two lawyers grade each answer separately.
  measure:
    - Wrong answers by task type, for each tool
    - Citations that don't exist or don't support the proposition
    - Agreement between the two graders
  shipsFirst: The question set, with agreed answers and pass thresholds, before either tool runs.
  trace: legal-and-professional-scenario
firstEngagement:
  needFromYou:
    - One decision to test, and a partner who agrees the pass thresholds first.
    - Questions from closed matters whose answers your lawyers know.
    - Access to each tool, in accounts your firm controls.
  youGet:
    - A side-by-side report listing every wrong answer and unsupported citation.
    - A data note per tool on where inputs are stored and processed.
    - The question set and a replay script for the next model change.
  exitRamp: Once the questions and thresholds are agreed, you decide whether to continue. The question set is yours either way.
faq:
  - q: You have no clients yet. Why trust your evaluation?
    a: "Don't take it on trust: we have no clients yet. Your lawyers write and grade the questions, and you can re-run the test without us."
  - q: Does testing mean our client files leave the firm?
    a: Only to the tools under test. Tests run in tool accounts your firm controls, on cleared matters or de-identified copies, and a data note first records where each tool stores and processes inputs. Whether a client must consent is your call.
  - q: Are you paid by legal AI vendors?
    a: No. We take no resale margin or referral fees from vendors we evaluate, and disclose any vendor relationship. We never issue an independent evaluation of a system we built, configured or advised on for the same firm.
  - q: Does your verification record meet the practice notes?
    a: No. The record is a log, not a safeguard. The responsible lawyer still verifies each authority; the record shows who checked it, against which source, and when.
  - q: Is this page only for law firms?
    a: Mostly. Consultancies can commission an independent evaluation of AI they deliver to clients, or use the Evaluation Partner route under their own contract.
