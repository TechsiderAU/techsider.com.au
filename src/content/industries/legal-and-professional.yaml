# /industries/legal-and-professional/ (spec §5, §8.5). Facts: .superpowers/research/2026-09-29/phase-c/industries/
# legal-and-professional.md, post-fact-check text. Held (Phase C rulings 1 and 7): the Federal Court GPN-AI row, until
# its live page is checked in a browser. No Trust Deed Register on this page; consultancies appear only as buyers of an
# independent evaluation. Four rows keep the page inside §8.5's word range. The joint statement binds NSW, Victoria
# and WA only (the dossier's correction 1), so the page names its three regulators.
# ⚑ owner: every commitment in this file, and in the design lines of src/data/regulatory/legal-and-professional.json, must be in the standard engagement terms (spec §12 item 2)
