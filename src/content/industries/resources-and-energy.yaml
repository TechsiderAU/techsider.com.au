mockPanel:
  title: "Conditions register: fictional approval"
  fields:
    - label: Condition
      value: Rehabilitate cleared areas under the approved plan
    - label: Evidence required
      value: Rehabilitation monitoring report
  chips:
    - status: ok
      text: Linked to its page in the approval
    - status: review
      text: Due date set by a plan clause, sent to a person
  citations:
    - source: Approval notice
      clause: Condition 12, page 14
scenario:
  title: One approval, one conditions register.
  problem: A fictional mid-tier miner holds two approvals for one project, and its environment lead rebuilds a conditions spreadsheet whenever a plan changes.
  approach: The system reads the approvals without changing them, turns each condition into a row linked to its page, and sends unclear rows to the environment lead.
  measure:
    - Conditions missed or misread against the answer key
    - How often it flags a row instead of guessing
    - Time the lead spends checking the register
  shipsFirst: A draft register for one approval, with page links and its error rate.
  trace: resources-and-energy-scenario
firstEngagement:
  needFromYou:
    - One approval and its plans, with read-only access.
    - The conditions your team already tracks, as the answer key.
    - A person to make the go/no-go call in week two.
  youGet:
    - A draft register, each row linked to its page.
    - The error rate, with every miss listed.
    - A one-page data note showing where each step ran.
  exitRamp: At the go/no-go in week two, you decide whether to continue. If you stop, you keep the draft register, the answer key and the test results.
faq:
  - q: Have you built this for a miner or utility before?
    a: No. We have no clients yet, so you start with a Two-Week Trial on one approval, measured against conditions your team already tracks.
  - q: We run a SOCI-covered asset. Where would our data be processed?
    a: Every step we build, model inference included, is designed to run in an Australian region. If your model isn't available there, we tell you before build. Inside a platform you already license, the vendor sets the location; we show you where.
  - q: Will this meet our CIRMP obligations?
    a: No. Your CIRMP stays yours. SOCI AI Risk Evidence gives your risk team artefacts such as data-flow maps and test reports. It isn't legal advice.
  - q: We already run Mitti or Microsoft Copilot. Why not use their AI?
    a: Try them first; if they answer your procedures well enough, we'll say so. We build for the manuals outside those tools.
  - q: Will the assistant work at remote sites?
    a: Only where the device can reach the service, because the model runs in the cloud. We check connectivity at your sites during the Trial.
