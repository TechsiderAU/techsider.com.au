scenario:
  title: A scribe pilot that went beyond general practice.
  problem: A fictional day-surgery group licensed a scribe after a GP-based demo. Its specialists say details go missing, and an update added next steps nobody asked for.
  approach: Clinicians role-play scripted consultations and write reference notes. Two clinicians label what the scribe leaves out or adds, and a scope test checks for any diagnosis, test or treatment never said.
  measure:
    - Omissions per note, by specialty
    - Scope-line breaches before and after the update
    - Agreement between the two raters
  shipsFirst: The week-0 threshold sheet and the scripted consultation set.
  trace: healthcare-scenario
firstEngagement:
  needFromYou:
    - A clinical lead who owns the thresholds.
    - Clinicians from each specialty to script, role-play and label consultations.
    - A test account in the scribe you already license.
  youGet:
    - An evaluation report with omissions and additions counted separately, and every failure listed.
    - The scope-test log for the version tested.
    - The test set and replay script, to re-run after each update.
  exitRamp: Once the scripted consultations and thresholds are agreed in week 0, and before testing starts, you decide whether to continue. If you stop, you keep the test design.
faq:
  - q: Have you evaluated a scribe before?
    a: "No. We have no clients yet, in health or anywhere else. Judge the method in our scope instead: sample size, reference notes, rater agreement and how omissions are counted."
  - q: Does patient data have to leave our environment?
    a: No. The test uses scripted consultations, not patient records, and the replay script runs in your own Microsoft or AWS account.
  - q: Will your report sign off the scribe?
    a: No. You get findings rated to your risk matrix and every failure listed. Whether a product is a medical device is the TGA's call.
  - q: Do you take commissions from scribe vendors?
    a: No. We take no resale margin or referral fees from vendors we evaluate, and disclose any vendor relationship. We never issue an independent evaluation of a system we built, configured or advised on for you.
  - q: We're a public health service. How do we engage you?
    a: "Directly, or through the Evaluation Partner route: we run the evaluation as a workstream under your existing prime, internal-audit co-source firm or law firm. Findings map to the AI instrument your state applies."
  - q: Do you cover life sciences?
    a: "One package, on request: the Compliance Dossier Builder turns the documents an audit or inspection asks for into a register linked to source pages."
