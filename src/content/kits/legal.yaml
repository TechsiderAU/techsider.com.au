industry: legal-and-professional
title: Legal Safe-Use Kit
summary: "A starter kit for firms in New South Wales, Victoria and Western Australia using AI in legal work, aligned to the regulators' joint statement of 6 December 2024 and to the AI practice notes of the Supreme Courts of NSW and Victoria and the County Court of Victoria."
contents:
  - "An AI use policy for your firm: the tools you approve, who may use them, for what, and with what client information"
  - "A confidentiality check for each tool: where inputs are stored and processed, and whether the provider keeps them or trains on them"
  - "A citation-check log for court documents: each authority, the source it was checked against, who checked it and when"
  - "Notes on the AI practice notes of the Supreme Court of NSW (SC Gen 23), the Supreme Court of Victoria (SC Gen 25) and the County Court of Victoria (PNCCV 1-2026)"
source:
