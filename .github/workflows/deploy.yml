name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild (Sunday 20:00 UTC, Monday morning in Australia), so build-time rules such as
  # Home's 45-day latest-insights rule (spec §8.1 block 9) re-evaluate without a push.
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # The action runs `npm run build`, CI checks included; launch-gate checks fail the deploy.
          VERIFY_MODE: gate

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
