name: CI

# Every branch push and every pull request: type-check, pristine build, CI content checks,
# unit tests, then the e2e suite in Chromium, WebKit and Firefox plus the production shell, and
# last the lab vitals gate. Weekly, on demand, and on a pull request into main: the report-only
# Lighthouse job.
on:
  push:
    branches: ["**"]
  pull_request:
  # Sunday 21:00 UTC, an hour after deploy.yml's weekly rebuild. GitHub runs a schedule, and
  # offers workflow_dispatch, only for a workflow file on the default branch: from the launch on.
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      contact_regression:
        description: Run the Firefox contact regression and isolated mobile vitals
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event as well as ref, so a scheduled run and a push to main never cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contact-regression:
    name: Firefox contact regression and mobile vitals
    if: github.event_name == 'workflow_dispatch' && inputs.contact_regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.18"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production and preview
        run: npm run build && npm run build:preview
      - name: Unit and markup tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Firefox contact regression
        run: npx playwright test tests/e2e/contact-form.spec.mjs --project=firefox
      - name: Site motion, navigation and reduced-motion accessibility
        run: npx playwright test tests/e2e/site-motion.spec.mjs tests/e2e/desktop-nav.spec.mjs tests/e2e/mobile-menu.spec.mjs --project=chromium --project=firefox
      - name: Production contact form and accessibility
        run: npx playwright test tests/e2e/prod-contact-form.spec.mjs tests/e2e/prod-company.spec.mjs --project=prod-chromium
      - name: Isolated mobile vitals
        run: npx playwright test tests/e2e/prod-vitals.spec.mjs --project=prod-vitals --no-deps
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contact-regression-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Build, check and test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Hosted system dependencies took 15 minutes; leave time for the full three-engine suite.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: tests/company-pages.test.mjs checks every About build-log entry against
          # the commits that made it, and a shallow clone holds only the latest commit.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # The engines floor: Node 22.18 is the first 22.x that strips TypeScript types by default.
          node-version: "22.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production (astro check, pristine-build gate, CI checks)
        run: npm run build
        env:
          # Launch-gate checks (VERIFY markers, regulatory rows, kit review) fail only PRs into main.
          VERIFY_MODE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'gate' || 'report' }}

      - name: Build preview (every planned page and the template gallery) and run its CI checks
        run: npm run build:preview

      - name: Unit and markup tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      # Both builds above already exist, so run Playwright directly: `npm run test:e2e`
      # (the local one-shot command) would build both again. The prod-vitals project, the lab
      # vitals gate, waits for every other project to finish, so it runs last and alone.
      - name: End-to-end tests (Chromium, WebKit, Firefox, the production shell, then the vitals gate)
        run: npx playwright test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Spec §1 criteria 4 and 5 by Lighthouse's own measure. Report only: the scores go to the job
  # summary, and a score below target fails nothing (tests/e2e/prod-vitals.spec.mjs is the gate).
  # A pull request into main (the launch PR) gets a report before the merge.
  lighthouse:
    name: Lighthouse report (report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Lighthouse 13.5.0 needs Node 22.19 or later; the test job stays on the engines floor.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Install Playwright's Chromium, which Lighthouse drives through CHROME_PATH
        run: npx playwright install --with-deps chromium

      - name: Lighthouse (mobile) on Home, one solution page and one industry page
        run: node scripts/ci/lighthouse-report.mjs

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: test-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 30
