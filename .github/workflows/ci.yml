name: CI

# Every branch push and every pull request: type-check, pristine build, CI content checks,
# unit tests, then the e2e suite in Chromium, WebKit and Firefox plus the production shell.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # The engines floor: Node 22.18 is the first 22.x that strips TypeScript types by default.
          node-version: "22.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production (astro check, pristine-build gate, CI checks)
        run: npm run build
        env:
          # Launch-gate checks (VERIFY markers, regulatory rows, kit review) fail only PRs into main.
          VERIFY_MODE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'gate' || 'report' }}

      - name: Build preview (every planned page and the template gallery) and run its CI checks
        run: npm run build:preview

      - name: Unit and markup tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      # Both builds above already exist, so run Playwright directly: `npm run test:e2e`
      # (the local one-shot command) would build both again.
      - name: End-to-end tests (Chromium, WebKit, Firefox and the production shell)
        run: npx playwright test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
